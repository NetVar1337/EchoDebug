[package]
name = "echo-debug-relay"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "io-std", "io-util"] }
serde_json = "1"
futures-util = "0.3"
sysinfo = { version = "0.40", default-features = false, features = ["system"] }
iced-x86 = "1"
object = { version = "0.40", features = ["read", "elf", "std"] }
getrandom = "0.4"
pdb = "0.8"
ureq = "3"
sha2 = "0.10"

[dev-dependencies]
tokio-tungstenite = "0.29"
tower = { version = "0.5", features = ["util"] }

[[bin]]
name = "echodebug-relay"
path = "src/main.rs"

# Linux local backend: Unicorn for `emulate`, ptrace for the debugger.
[target.'cfg(target_os = "linux")'.dependencies]
unicorn-engine = { version = "2.1", default-features = false, features = ["arch_x86"] }
nix = { version = "0.31", features = ["ptrace", "process", "signal"] }

# Windows: DPAPI keeps the assistant's API key encrypted for the user account.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }
