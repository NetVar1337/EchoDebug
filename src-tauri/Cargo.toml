[package]
name = "echo-debug"
version = "0.8.7"
description = "Windows reverse-engineering desktop app backed by Echo"
edition = "2021"
publish = false

[lib]
name = "echo_debug_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "7"
echo-debug-relay = { path = "relay" }

[workspace]
members = [".", "relay"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
