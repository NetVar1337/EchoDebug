version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    commit-message: { prefix: "chore(deps)" }
    groups:
      npm: { patterns: ["*"] }
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule: { interval: weekly }
    commit-message: { prefix: "chore(deps)" }
    groups:
      cargo: { patterns: ["*"] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    commit-message: { prefix: "chore(ci)" }
