name: CI

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Frontend (typecheck, tests, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: node --test scripts/*.test.mjs
      - run: npm run build
      - name: Disassembler sync client (IDA / Binary Ninja core)
        run: python3 -m unittest discover -s integrations/python -v

  agent:
    name: Echo agent (AngelScript lint)
    runs-on: ubuntu-latest
    env:
      LSP_REV: 700a15c05d4ed85559e4a40205f9260822c3b18f
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Build echo-angelscript-lsp (pinned, the lint imports its internals)
        run: |
          git clone https://github.com/speedsunderscore/echo-angelscript-lsp.git "$RUNNER_TEMP/lsp"
          cd "$RUNNER_TEMP/lsp" && git checkout "$LSP_REV" && npm ci --ignore-scripts && npm run compile
      - run: node scripts/lint-agent.mjs "$RUNNER_TEMP/lsp" agent/echo_debug.as

  agent-tests:
    name: Echo agent (AngelScript tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build test host (fetches the pinned AngelScript SDK)
        run: |
          cmake -S tests/agent -B build/agent-tests -DCMAKE_BUILD_TYPE=Release
          cmake --build build/agent-tests -j
      - run: ctest --test-dir build/agent-tests --output-on-failure

  relay:
    name: Relay (cargo test + clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: cargo test -p echo-debug-relay
        working-directory: src-tauri
      - run: cargo clippy -p echo-debug-relay --all-targets -- -D warnings
        working-directory: src-tauri

  e2e:
    name: End-to-end UI (Linux local backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # the relay attaches to a process it did not start: allow ptrace / /proc/<pid>/mem across the session
      - run: sudo sysctl -w kernel.yama.ptrace_scope=0
      - run: npm ci
      - run: cargo build -p echo-debug-relay --bin echodebug-relay
        working-directory: src-tauri
      - run: npm i --no-save playwright@1.63.0 && npx playwright install --with-deps chromium
      - run: npm run test:e2e

  app:
    name: Windows app (cargo check)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run build
      - run: cargo check -p echo-debug
        working-directory: src-tauri

  app-linux:
    name: Linux app (cargo check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - run: npm ci
      - run: npm run build
      - run: cargo check -p echo-debug
        working-directory: src-tauri
