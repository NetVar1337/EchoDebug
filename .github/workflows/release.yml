name: Release

# Every push to main (a direct commit or a merged PR) bumps the patch version (only a breaking
# change bumps minor while we are pre-1.0), tags it, builds the signed Windows and Linux
# bundles and publishes a GitHub release with latest.json, which the in-app updater polls.
# The bot's own "chore(release)" commit carries [skip ci] and is skipped below, so it never loops.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: Force a bump (leave empty to derive from commits)
        type: choice
        options: ["", patch, minor, major]
        default: ""

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  ci:
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(release)') }}
    uses: ./.github/workflows/ci.yml

  version:
    needs: ci
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Latest main, not the triggering sha: runs are serialised, so a newer push may
          # already be on main and the bump commit must fast-forward onto it
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: next
        name: Compute next version
        run: |
          v=$(node scripts/next-version.mjs --notes "$RUNNER_TEMP/notes.md" ${BUMP:+--bump $BUMP})
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "next version: ${v:-<none, no commit since the last release>}"
        env:
          BUMP: ${{ inputs.bump }}
      - name: Bump, commit and tag
        if: steps.next.outputs.version != ''
        run: |
          v=${{ steps.next.outputs.version }}
          node scripts/set-version.mjs "$v"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(release): v$v [skip ci]" || echo "version already at $v"
          git tag -a "v$v" -F "$RUNNER_TEMP/notes.md"
          git push origin HEAD:main "v$v"
      - uses: actions/upload-artifact@v7
        if: steps.next.outputs.version != ''
        with:
          name: notes
          path: ${{ runner.temp }}/notes.md

  build:
    needs: version
    if: needs.version.outputs.version != ''
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v${{ needs.version.outputs.version }}
      - uses: actions/download-artifact@v8
        with:
          name: notes
          path: notes
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - id: notes
        shell: bash
        run: |
          {
            echo "body<<__NOTES__"
            cat notes/notes.md
            printf '\n\n**Install (Windows):** run `EchoDebug_%s_x64-setup.exe` (per-user, no admin) or `EchoDebug_%s_x64_en-US.msi` (per-machine). Both update themselves.' "$VERSION" "$VERSION"
            printf '\n\n**Install (Ubuntu/Linux):** `EchoDebug_%s_amd64.deb` installs with `sudo dpkg -i` / the Software app; `EchoDebug_%s_amd64.AppImage` runs as is. Both update themselves (the .deb asks for your password to install). On Linux the app previews the full UI and talks MCP; process memory comes from a local `/proc` backend (the Echo agent is Windows-only).\n' "$VERSION" "$VERSION"
            printf '\n\n**Echo agent (Windows):** `echo_debug.as` is attached below and is also installed automatically to `%%APPDATA%%\\scripts` when EchoDebug starts.\n'
            echo "__NOTES__"
          } >> "$GITHUB_OUTPUT"
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v${{ env.VERSION }}
          releaseName: EchoDebug v${{ env.VERSION }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          # NSIS installs update through NSIS, MSI installs through MSI (latest.json carries both)
          updaterJsonPreferNsis: true
      - name: Attach Echo agent script
        shell: bash
        run: gh release upload "v$VERSION" agent/echo_debug.as --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Ubuntu/.deb + AppImage, both signed. The updater only installs the format the app was
  # installed as, so latest.json gets linux-x86_64-deb and linux-x86_64-appimage entries.
  build-linux:
    needs: [version, build]
    if: needs.version.outputs.version != ''
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v${{ needs.version.outputs.version }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - run: npm ci
      - run: npm run build
      - name: Build .deb and AppImage
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          npx tauri build --bundles appimage,deb
          # createUpdaterArtifacts signs the AppImage; sign the .deb too if the bundler did not
          for deb in target/release/bundle/deb/*.deb; do [ -f "$deb.sig" ] || npx tauri signer sign "$deb"; done
        working-directory: src-tauri
      - name: Upload Linux artifacts and extend latest.json
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          cd src-tauri/target/release/bundle
          ls appimage deb
          # updater artifacts are the bundles themselves, each with a .sig next to it
          APPIMAGE=$(ls appimage/*.AppImage | head -1)
          DEB=$(ls deb/*.deb | head -1)
          gh release upload "v$VERSION" "$APPIMAGE" "$APPIMAGE.sig" "$DEB" "$DEB.sig" --clobber
          cd "$GITHUB_WORKSPACE"
          gh release download "v$VERSION" --pattern latest.json --dir .
          B=src-tauri/target/release/bundle
          node scripts/merge-latest-json.mjs latest.json "$VERSION" "$B/$APPIMAGE" "$B/$DEB"
          gh release upload "v$VERSION" latest.json --clobber
